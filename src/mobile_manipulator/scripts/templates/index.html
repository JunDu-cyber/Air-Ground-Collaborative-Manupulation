<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Robotics Console v2</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Lucide Icons Script -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  /* New Color Logic: Industrial Tech */
  --bg: #f8f9fa;
  --sidebar: #ffffff;
  --panel: #ffffff;
  --accent: #0062ff; /* Deeper technical blue */
  --accent-soft: rgba(0, 98, 255, 0.08);
  --border: #e9ecef;
  --danger: #eb0000;
  --ok: #22c55e;
  --text: #1a1d21;
  --muted: #64748b;
  --mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter', system-ui;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:28px;
  box-shadow: 2px 0 10px rgba(0,0,0,0.02);
}

.logo{
  font-weight:700;
  font-size:1rem;
  letter-spacing: -0.02em;
  color:var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title{
  font-size:0.65rem;
  font-weight: 700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom: 12px;
}

.quick{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.quick button{
  background: var(--bg);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  font-size: 0.85rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
}

.quick button i { width: 16px; height: 16px; opacity: 0.7; }

.quick button:hover{
  background: var(--accent-soft);
  border-color:var(--accent);
  color: var(--accent);
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background: rgba(255,255,255,0.8);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:0.85rem;
  font-weight: 600;
  color: var(--muted);
}

.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--ok);
  box-shadow: 0 0 10px var(--ok);
  animation: dotPulse 2s infinite;
}

.estop{
  border:2px solid var(--danger);
  color:var(--danger);
  background:none;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight: 700;
  font-size: 0.75rem;
  letter-spacing: 1px;
}

.estop.active{
  background:var(--danger);
  color:#fff;
  animation: dangerPulse 1s infinite;
}

/* CHAT */
.chat{
  flex:1;
  padding:24px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.msg{
  max-width:75%;
  padding:12px 16px;
  border-radius:12px;
  line-height:1.5;
  font-size: 0.95rem;
  animation: fadeUp .2s ease-out;
}

.user{
  align-self:flex-end;
  background:var(--accent);
  color:#fff;
  border-radius: 12px 12px 2px 12px;
  box-shadow: 0 4px 12px rgba(0, 98, 255, 0.2);
}

.robot{
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius: 2px 12px 12px 12px;
}

.tag{
  font-family: var(--mono);
  font-size:0.6rem;
  color:var(--accent);
  margin-bottom:8px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* INPUT */
.input{
  padding:20px 24px;
  display:flex;
  gap:12px;
  border-top:1px solid var(--border);
  background:var(--panel);
}

.input input{
  flex:1;
  background:var(--bg);
  border:1px solid var(--border);
  padding:12px 16px;
  border-radius:10px;
  color:var(--text);
  outline: none;
}

.input input:focus{
  border-color: var(--accent);
}

.input button{
  background:var(--accent);
  border:none;
  padding:0 20px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

@keyframes fadeUp{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes dangerPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(235,0,0,0.4)} 50%{box-shadow:0 0 0 8px rgba(235,0,0,0)} }
@keyframes dotPulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo"><i data-lucide="bot"></i> NEXUS CONTROL</div>

  <div>
    <div class="section-title">Quick Commands</div>
    <div class="quick">
      <button onclick="cmd('Scan environment')"><i data-lucide="maximize"></i> Scan Environment</button>
      <button onclick="cmd('grab the coke for me plz, which is on the table in kitchen')"><i data-lucide="grab"></i> Pick Coke</button>
      <button onclick="cmd('Return to base')"><i data-lucide="home"></i> Return Base</button>
      <button onclick="cmd('Release object')" style="color:var(--danger)"><i data-lucide="log-out"></i> Release</button>
    </div>
  </div>
</div>

<div class="main">

  <div class="header">
    <div class="status"><div class="dot"></div> <span style="font-family:var(--mono)">SYS_OK:</span> ROS ONLINE</div>
    <button class="estop" id="estop">EMERGENCY STOP</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input">
    <input id="input" placeholder="Execute robotic command..." />
    <button onclick="send()">Execute <i data-lucide="play" size="16"></i></button>
  </div>

</div>

<script>
const chat = document.getElementById('chat');

function add(role, text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML = role==='robot' 
    ? `<div class='tag'><i data-lucide="terminal" size="12"></i> SYSTEM_REPLY</div><div style="font-family:var(--mono); font-size:0.85rem">${text}</div>` 
    : text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  lucide.createIcons(); // Initialize icons for new messages
}

function cmd(t){
  document.getElementById('input').value=t;
}

async function send(){
  const input=document.getElementById('input');
  const val=input.value.trim();
  if(!val)return;

  add('user',val);
  input.value='';

  const loadingId = "loader-" + Date.now();
  const loading = document.createElement('div');
  loading.className = 'msg robot';
  loading.id = loadingId;
  loading.innerHTML = `<div class='tag'><i data-lucide="refresh-cw" size="12"></i> PROCESSING...</div>`;
  chat.appendChild(loading);
  lucide.createIcons();

  try{
    const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:val})});
    const d=await r.json();
    document.getElementById(loadingId).remove();
    add('robot',d.response||d.error);
  }catch(e){
    document.getElementById(loadingId).remove();
    add('robot','NETWORK_ERROR: UNABLE TO REACH ROS BRIDGE');
  }
}

// E-STOP
const estopBtn=document.getElementById('estop');
let active=false;

estopBtn.onclick=async()=>{
  const r=await fetch('/api/estop',{method:'POST'});
  const d=await r.json();
  active=d.active;
  estopBtn.classList.toggle('active',active);
  add('robot',active?'CRITICAL: E-STOP ENGAGED':'STATUS: E-STOP RELEASED. READY.');
}

// Initial Run
lucide.createIcons();
add('robot','System initialized. Neural pathways active.');
</script>

</body>
</html>
