<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Husky UR5 — Command Center</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  /* 高级渐变背景 */
  background: linear-gradient(135deg, #090b10 0%, #161b28 100%);
  color: #e6edf3; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header (毛玻璃效果) ── */
header {
  padding: 16px 24px; 
  background: rgba(22, 27, 34, 0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 1.15rem; font-weight: 600; color: #79c0ff; letter-spacing: 0.5px; }

/* 状态灯盘 */
.status-container { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #8b949e; }
.dot { 
  width: 10px; height: 10px; border-radius: 50%; background: #3fb950; 
  box-shadow: 0 0 10px rgba(63, 185, 80, 0.6); animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

/* ── Chat log ── */
.chat-log {
  flex: 1; overflow-y: auto; padding: 24px;
  display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
}
.chat-log::-webkit-scrollbar { width: 6px; }
.chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.bubble {
  max-width: 80%; padding: 14px 18px; border-radius: 16px;
  font-size: 0.95rem; line-height: 1.6; word-break: break-word;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.bubble.user  { align-self: flex-end; background: linear-gradient(135deg, #1f6feb 0%, #0c4a6e 100%); border-bottom-right-radius: 4px; }
.bubble.robot { align-self: flex-start; background: rgba(33, 38, 45, 0.8); border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 4px; backdrop-filter: blur(8px); }
.bubble.robot .tag { font-size: 0.75rem; color: #79c0ff; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;}

/* 动态打字机效果 */
.typing-indicator { display: flex; gap: 4px; align-items: center; height: 20px;}
.typing-indicator span { width: 6px; height: 6px; background-color: #8b949e; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

/* ── 底部控制区 ── */
.control-panel { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.08); padding: 12px 24px 24px 24px; display: flex; flex-direction: column; gap: 12px; }

/* 快捷指令胶囊 */
.quick-actions { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.quick-actions::-webkit-scrollbar { display: none; }
.chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #c9d1d9; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.chip:hover { background: rgba(255,255,255,0.15); border-color: #79c0ff; color: #fff; }

/* 输入栏 */
.input-form { display: flex; gap: 12px; }
.input-form input { flex: 1; background: rgba(13, 17, 23, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; color: #e6edf3; font-size: 1rem; outline: none; transition: all 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
.input-form input:focus { border-color: #79c0ff; background: #0d1117; box-shadow: 0 0 0 3px rgba(121, 192, 255, 0.2); }
.input-form button { background: #238636; border: none; border-radius: 12px; padding: 0 28px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(35, 134, 54, 0.3); }
.input-form button:hover:not(:disabled) { background: #2ea043; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(46, 160, 67, 0.4); }
.input-form button:active:not(:disabled) { transform: translateY(0); }
.input-form button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; box-shadow: none; transform: none; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Husky UR5 — Nexus Console</h1>
  </div>
  <div class="status-container">
    <div class="dot"></div>
    <span>ROS Core: Online</span>
  </div>
</header>

<div class="chat-log" id="chatLog">
  <div class="bubble robot">
    <div class="tag">✦ System</div>
    LLM TAMP Agent is online. Telemetry received. Ready for commands.
  </div>
</div>

<div class="control-panel">
  <div class="quick-actions">
    <div class="chip" onclick="setCmd('Scan the environment')">👁️ Scan Room</div>
    <div class="chip" onclick="setCmd('Can you grab my cup please?')">☕ Grab Cup</div>
    <div class="chip" onclick="setCmd('Drive back to the kitchen')">🗺️ Go to Kitchen</div>
    <div class="chip" style="border-color: #f85149; color: #f85149;" onclick="setCmd('Open gripper and release the object')">⚠️ Drop Object</div>
  </div>

  <form class="input-form" id="cmdForm">
    <input id="cmdIn" type="text" placeholder="Command the robot..." autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
function setCmd(text) {
  const inp = document.getElementById('cmdIn');
  inp.value = text;
  inp.focus();
}

function addBubble(cls, html) {
  const log = document.getElementById('chatLog');
  const d = document.createElement('div');
  d.className = `bubble ${cls}`;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function showTyping() {
  const html = `<div class="tag">✦ LLM Processing</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
  const bubble = addBubble('robot', html);
  bubble.id = 'typingBubble';
  return bubble;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
}

document.getElementById('cmdForm').addEventListener('submit', async (e) => {
  e.preventDefault(); 
  
  const inp = document.getElementById('cmdIn');
  const btn = document.getElementById('sendBtn');
  const cmd = inp.value.trim();
  if (!cmd) return;

  inp.value = '';
  inp.disabled = true; btn.disabled = true;
  
  addBubble('user', esc(cmd));
  const typingBubble = showTyping();

  try {
    const r = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
    });
    
    typingBubble.remove();
    const data = await r.json();
    
    if (data.error) {
      addBubble('robot', `<div class="tag" style="color: #f85149;">⚠ Error</div>${esc(data.error)}`);
    } else {
      addBubble('robot', `<div class="tag">✦ Robot Agent</div>${esc(data.response)}`);
    }
  } catch (error) {
    typingBubble.remove();
    addBubble('robot', `<div class="tag" style="color: #f85149;">⚠ System Failure</div>Network error: ${error.message}`);
  } finally {
    inp.disabled = false; btn.disabled = false; inp.focus();
  }
});
</script>
</body>
</html>
