local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  # Loaded return is dynamically raised to 3.4 m/s.  Over the 1 s DWA horizon
  # a 10 m rolling window keeps the complete Husky footprint and braking
  # samples visible instead of clipping fast trajectories at the boundary.
  width: 10.0
  height: 10.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: mine_hazard_layer, type: "mobile_manipulator::MineHazardLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
