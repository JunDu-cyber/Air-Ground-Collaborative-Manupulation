DWAPlannerROS:
  # --- Velocity limits ---
  # 空载平地出程提高到 2.8 m/s。已由 Gazebo 插件无反力锁定的携雷返程由
  # 任务管理器动态切换到 3.4 m/s；放置区不再执行底盘厘米级精对准。
  # 10 m 本地代价图完整覆盖 1 s DWA 预测和制动余量。
  max_vel_x:           2.8
  min_vel_x:           0.0
  max_vel_y:           0.0
  min_vel_y:           0.0
  max_vel_trans:       2.8
  min_vel_trans:       0.15
  max_vel_theta:       1.0
  min_vel_theta:       0.1    # 降低末端朝向修正的过冲和左右振荡

  # --- Acceleration limits ---
  # 平地空载加速；携雷阶段由任务管理器动态保持 3.0 m/s^2。
  acc_lim_x:     3.0
  acc_lim_y:     0.0
  acc_lim_theta: 1.5

  # --- Goal tolerance ---
  # Wrist grasping needs the base radius error around 5 cm; the mission manager
  # independently rechecks TF before unlocking the arm.
  xy_goal_tolerance:  0.03
  yaw_goal_tolerance: 0.06
  # Once the parking position is reached, finish heading without driving out
  # of the grasp ring again. The previous false setting caused circles.
  latch_xy_goal_tolerance: true

  # --- Trajectory sampling ---
  sim_time:          1.0      # was 1.5 — faster replanning indoors
  sim_granularity:   0.025
  angular_sim_granularity: 0.025
  vx_samples:        20
  vy_samples:        0
  vtheta_samples:    40
  use_dwa:           true

  # --- Scoring ---
  path_distance_bias:    20.0
  goal_distance_bias:    24.0
  occdist_scale:         0.1
  forward_point_distance: 0.5
  stop_time_buffer:       0.2
  # The former 0.5 factor enlarged the 0.99 x 0.68 m Husky footprint by 50%
  # at cruise speed.  That is footprint growth, not a "50% speed allowance";
  # it made otherwise valid lanes disappear and produced stop/go motion.  The
  # 1.2 m inflation layer and DWA stop-time check already provide clearance.
  scaling_speed:          1.0
  max_scaling_factor:     0.0

  # --- Oscillation prevention ---
  oscillation_reset_dist:  0.05
  oscillation_reset_angle: 0.2
