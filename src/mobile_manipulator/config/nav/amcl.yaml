min_particles: 500
max_particles: 2000
kld_err: 0.05
kld_z: 0.99

# Motion model — differential drive
robot_model_type: diff
alpha1: 0.2   # rotation noise from rotation
alpha2: 0.2   # rotation noise from translation
alpha3: 0.1   # translation noise from translation
alpha4: 0.1   # translation noise from rotation

# Laser model
laser_model_type: likelihood_field
laser_max_beams: 60
laser_z_hit: 0.5
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.5
laser_sigma_hit: 0.2
laser_min_range: 0.1
laser_max_range: 10.0

# Frames
base_frame_id: base_link
odom_frame_id: odom
global_frame_id: map

# Update frequency
update_min_d: 0.2       # update after 20cm movement
update_min_a: 0.3       # update after ~17 degrees rotation
resample_interval: 2
transform_tolerance: 0.3
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1

# Initial pose — set to your robot's spawn position
initial_pose_x: 1.5
initial_pose_y: 0.5
initial_pose_a: 0.0
initial_cov_xx: 0.25
initial_cov_yy: 0.25
initial_cov_aa: 0.07