# 1. The Trajectory Controller for MoveIt
ur5_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
     - ur5_shoulder_pan_joint
     - ur5_shoulder_lift_joint
     - ur5_elbow_joint
     - ur5_wrist_1_joint
     - ur5_wrist_2_joint
     - ur5_wrist_3_joint
  constraints:
      goal_time: 5.0                    # was 0.6 — too tight, caused abort-and-retry dancing
      stopped_velocity_tolerance: 0.1
      ur5_shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
      ur5_shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
      ur5_elbow_joint: {trajectory: 0.1, goal: 0.1}
      ur5_wrist_1_joint: {trajectory: 0.1, goal: 0.1}
      ur5_wrist_2_joint: {trajectory: 0.1, goal: 0.1}
      ur5_wrist_3_joint: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.0        # was 0.5 — each stop() was running a 0.5 s hold trajectory
  state_publish_rate:  25
  action_monitor_rate: 10

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# 2. The Gripper Controller (Robotiq 2F-140: single actuated finger_joint)
gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - finger_joint
  constraints:
    goal_time: 2.0                  # allow the linkage time to settle
    stopped_velocity_tolerance: 0.05
    finger_joint: {trajectory: 0.2, goal: 0.05}   # loose: grasping rarely hits exact angle
