# 1. The Trajectory Controller for MoveIt
ur5_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
     - ur5_shoulder_pan_joint
     - ur5_shoulder_lift_joint
     - ur5_elbow_joint
     - ur5_wrist_1_joint
     - ur5_wrist_2_joint
     - ur5_wrist_3_joint
  constraints:
      goal_time: 5.0                    # was 0.6 — too tight, caused abort-and-retry dancing
      # Gazebo's controller-state velocity field was measured at
      # 0.0508-0.0551 rad/s while the same 0.52 s joint-position windows moved
      # less than 0.0000016 rad.  Keep the action server from timing out on that
      # field-only disagreement; mine_grasp_executor still applies its stricter
      # independent <=0.05 rad/s position-window/TCP/span/attitude gate after
      # every MoveIt, Cartesian and direct-joint motion.
      stopped_velocity_tolerance: 0.08
      ur5_shoulder_pan_joint: {trajectory: 0.1, goal: 0.01}
      ur5_shoulder_lift_joint: {trajectory: 0.1, goal: 0.01}
      ur5_elbow_joint: {trajectory: 0.1, goal: 0.01}
      ur5_wrist_1_joint: {trajectory: 0.1, goal: 0.01}
      ur5_wrist_2_joint: {trajectory: 0.1, goal: 0.01}
      ur5_wrist_3_joint: {trajectory: 0.1, goal: 0.01}
  stop_trajectory_duration: 0.0        # was 0.5 — each stop() was running a 0.5 s hold trajectory
  state_publish_rate:  25
  action_monitor_rate: 10

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# 2. The Gripper Controller (Robotiq 2F-140: single actuated finger_joint)
gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - finger_joint
  constraints:
    goal_time: 2.0                  # allow the linkage time to settle
    stopped_velocity_tolerance: 0.02
    finger_joint: {trajectory: 0.2, goal: 0.01}
  stop_trajectory_duration: 0.0
  state_publish_rate: 25
  action_monitor_rate: 10
