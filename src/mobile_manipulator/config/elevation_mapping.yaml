# elevation_mapping (ANYbotics/ETH) configuration for the air-ground system.
#
# EGOCENTRIC (UGV-centric) terrain map. The grid lives in the UGV's drift-free
# "odom" frame and tracks the Husky's base_link, so it is centred on the robot
# and is the natural frame for the UGV's downstream localization / navigation.
# The terrain is sensed from above by the (stand-in) UAV's aerial point cloud
# (/uav/points -> /uav/points_downsampled), while the UGV stays static at its
# initial pose during scanning.
#
# UAV pose-error propagation: the UAV's localization error is expressed at the
# UGV centre as Sigma_{odom->uav} and published on /uav/pose_cov by
# scripts/uav_pose_cov_publisher.py. Three channels feed the repo's own
# uncertainty machinery:
#   * attitude  -> per-point height variance (range-amplified lever arm). Driven
#                  by robot_base_frame_id = uav_camera_link so the lever arm
#                  pivots at the UAV, the real sensor platform.
#   * horiz GPS -> height-on-slope, via min_horizontal_variance below + the
#                  built-in ElevationMap::fuse() error-ellipse integration.
#   * altitude  -> direct height variance (small additive patch to
#                  PerfectSensorProcessor; see patches/).

# --- Frames ---
map_frame_id:                     "odom"               # UGV drift-free egocentric frame
robot_base_frame_id:              "uav_camera_link"    # variance lever-arm pivots at the UAV (sensor platform)
track_point_frame_id:             "base_link"          # map stays centred on the UGV
track_point_x:                    0.0
track_point_y:                    0.0
track_point_z:                    0.0
robot_pose_with_covariance_topic: "/uav/pose_cov"      # Sigma_{odom->uav} from uav_pose_cov_publisher.py
robot_pose_cache_size:            200

# --- Post-processing output ---
# The postprocessor (see elevation_postprocessor.yaml) runs the inpaint/normals/
# slope pipeline on a copy of the fused map and publishes the result (with the
# extra layers) to its OWN topic. Give it a distinct name so it does not collide
# with the built-in raw map (whose default it otherwise reuses). The postprocessor
# is lazy: it only runs while something subscribes to this topic.
output_topic: "elevation_map_postprocessed"
postprocessor_pipeline_name: "postprocessor_pipeline"

# --- Input: UAV aerial point cloud ---
input_sources:
  uav:
    type: pointcloud
    topic: /uav/points_downsampled
    queue_size: 1
    publish_on_update: true
    sensor_processor:
      type: perfect          # noise-free simulated depth camera (ground truth)

# --- Update / timing ---
min_update_rate:                  1.0
time_tolerance:                   1.0
time_offset_for_point_cloud:      0.0
fused_map_publishing_rate:        1.0
scanning_duration:                1.0

# Visibility cleanup ray-traces from the sensor to erase cells that "should" be
# visible; it assumes an onboard sensor and misbehaves with a fixed aerial
# vantage, so it is disabled here.
enable_visibility_cleanup:        false
visibility_cleanup_rate:          1.0

# --- Map geometry (robot-centric) ---
length_in_x:                      50.0
length_in_y:                      50.0
position_x:                       0.0
position_y:                       0.0
resolution:                       0.25
surface_normal_positive_axis:     z

# --- Fusion noise model ---
min_variance:                     0.0001
max_variance:                     8.0
mahalanobis_distance_threshold:   2.5
multi_height_noise:               0.001

# UAV horizontal (GPS) position uncertainty channel. add() resets every cell's
# horizontal variance to this floor, then ElevationMap::fuse() integrates an
# error ellipse of this size over local height differences -> on a slope the
# fused height variance grows by ~ (slope * sigma_xy)^2. Keep this equal to the
# publisher's gps_xy_sigma^2 (default 0.5 m -> 0.25).
min_horizontal_variance:          0.25
max_horizontal_variance:          0.5

# --- Init submap (start with an empty map) ---
initialize_elevation_map:         false
initialization_method:            0
