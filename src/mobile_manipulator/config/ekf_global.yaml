# Global EKF (map frame) for outdoor GPS-fused localization.
#
# This is the second filter in the dual-EKF robot_localization pattern:
#   * The LOCAL ekf (husky_control/localization.yaml, world_frame=odom) fuses
#     wheel odometry + IMU and publishes a smooth, continuous odom->base_link.
#   * This GLOBAL ekf fuses wheel odometry + IMU + GPS (via navsat_transform's
#     odometry/gps) and publishes map->odom, anchoring the robot to world GPS
#     coordinates. The map->odom correction absorbs the local odom drift.
#
# Output topic: odometry/filtered_map (consumed by navsat_transform_node).

frequency: 30.0
sensor_timeout: 0.1

# Give TF lookups a 0.1 s grace window instead of failing instantly. Without
# this, the filter logs "Transform ... unavailable, using latest instead" at
# every cycle because the map->odom->base_link chain lags the sensor timestamp
# by a few ms.
transform_timeout: 0.1

# 3D 估计：让 map 系里的 base_link 跟随真实地形高度/俯仰，UGV 在 RViz 的坡上不再
# 被埋到坡面下。z 由 Gazebo 真值(odom2 = /ground_truth/state)提供(GPS 高度太吵不用)，
# roll/pitch 由 IMU 提供。x/y/yaw 仍由轮速+GPS+IMU 主导，2D 导航行为不变(代价图仍是
# 2D)。local EKF 保持 2D 即可——RViz fixed frame=map，本滤波器的 map->odom 会带上 z。
two_d_mode: false

publish_tf: true
predict_to_current_time: true

# 给发布的 map->odom TF 盖一点提前量。否则 move_base 局部规划器按"当前时刻"查
# map<->odom 时会落到未来，抛 ExtrapolationException：
#   "Could not transform the global plan to the frame of the controller"
# 最新完整任务在 CPU 推理负载下实测 map->odom 最迟落后当前时刻 0.052s，
# 且 EKF 单次更新偶发需要 0.15s。提前 0.5s 覆盖这种调度抖动，避免 DWA
# 间歇拿不到局部路径而发布零速度；TF 查询仍按共同时间插值。
transform_time_offset: 0.5

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map          # this EKF owns the map->odom transform

# --- Wheel odometry: use velocities only (position drifts) ---
odom0: husky_velocity_controller/odom
odom0_config: [false, false, false,
               false, false, false,
               true,  true,  false,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_queue_size: 10

# --- IMU: orientation + angular velocity ---
imu0: imu/data
imu0_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              true,  true,  true,
              false, false, false]
imu0_differential: false
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

# --- GPS (as map-frame odometry from navsat_transform): absolute X/Y ---
odom1: odometry/gps
odom1_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 10

# --- Gazebo 地面真值(p3d, /ground_truth/state): 只取绝对高度 z ---
# 让 base_link 在 map 系跟随真实地形高度(坡上抬升)。只融合 z(position 第3位)，
# 不动 x/y/yaw —— 那些仍由 GPS/轮速/IMU 主导，导航行为不变。
odom2: /ground_truth/state
odom2_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom2_differential: false
odom2_queue_size: 10
